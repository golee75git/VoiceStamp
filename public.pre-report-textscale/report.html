<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>VoiceStamp — 보고서 편집</title>
  <style>
    :root { color-scheme: light; }
    body { font-family: system-ui, sans-serif; max-width: 56rem; margin: 0 auto; padding: 1.25rem; color: #111; line-height: 1.5; background: #f9fafb; }
    a { color: #2563eb; }
    nav { margin-bottom: 1rem; }
    h1 { font-size: 1.5rem; margin: 0 0 0.25rem; }
    .muted { color: #6b7280; font-size: 0.9rem; }
    .panel { background: #fff; border: 1px solid #e5e7eb; border-radius: 10px; padding: 1rem; margin: 1rem 0; }
    .toolbar { display: flex; flex-wrap: wrap; gap: 0.5rem; margin-top: 0.75rem; }
    button, .file-btn { border: 1px solid #2563eb; background: #fff; color: #2563eb; border-radius: 8px; padding: 0.55rem 0.9rem; font-weight: 600; cursor: pointer; }
    button.primary { background: #2563eb; color: #fff; }
    button:disabled { opacity: 0.45; cursor: not-allowed; }
    input[type="file"] { display: none; }
    table { width: 100%; border-collapse: collapse; font-size: 0.92rem; }
    th, td { border: 1px solid #e5e7eb; padding: 0.45rem; vertical-align: top; }
    th { background: #f3f4f6; text-align: left; }
    td input, td textarea { width: 100%; box-sizing: border-box; border: 1px solid #d1d5db; border-radius: 6px; padding: 0.35rem 0.5rem; font: inherit; }
    td textarea { min-height: 3.2rem; resize: vertical; }
    .thumb { width: 96px; height: 72px; object-fit: cover; border-radius: 4px; background: #e5e7eb; cursor: zoom-in; }
    .lightbox {
      position: fixed;
      inset: 0;
      z-index: 1000;
      background: rgba(0, 0, 0, 0.75);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }
    .lightbox[hidden] { display: none; }
    .lightbox img {
      max-width: min(96vw, 1200px);
      max-height: 90vh;
      object-fit: contain;
      border-radius: 8px;
      background: #fff;
    }
    .report-title-input { width: 100%; max-width: 28rem; border: 1px solid #d1d5db; border-radius: 8px; padding: 0.5rem 0.75rem; font-size: 1rem; }
    .status { margin-top: 0.75rem; color: #374151; font-size: 0.9rem; }
    .settings-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(12rem, 1fr));
      gap: 0.75rem;
      margin-top: 0.75rem;
    }
    .settings-grid label { display: flex; flex-direction: column; gap: 0.25rem; font-size: 0.85rem; color: #374151; }
    .settings-grid select { border: 1px solid #d1d5db; border-radius: 6px; padding: 0.35rem 0.5rem; font: inherit; }
    @media print {
      nav, .panel.upload, .panel.export-settings, .toolbar, .status, .lightbox { display: none !important; }
      body { background: #fff; padding: 0; }
      .panel { border: none; padding: 0; }
      td input, td textarea { border: none; padding: 0; }
      .thumb { max-width: 180px; max-height: 140px; width: auto; height: auto; }
    }
    .print-report h2 { text-align: center; margin: 0 0 1rem; }
    .print-item { page-break-inside: avoid; margin-bottom: 1.25rem; }
    .print-item img { max-width: 100%; height: auto; display: block; margin: 0.5rem auto; }
    .print-meta { margin-top: 0.35rem; }
  </style>
</head>
<body>
  <nav><a href="/">← 앱으로</a> · <a href="/info">앱 정보</a></nav>
  <h1>VoiceStamp 보고서 편집</h1>
  <p class="muted">앱에서 보낸 <code>.voicestamp.zip</code>을 PC에서 열어 제목·메모·층을 수정하고, 합성 JPEG·PDF를 저장할 수 있습니다. <strong>파일은 서버로 전송되지 않으며</strong> 브라우저에서만 처리됩니다.</p>

  <section class="panel upload">
    <label class="file-btn" for="zipInput">프로젝트 ZIP 열기</label>
    <input id="zipInput" type="file" accept=".zip,.voicestamp.zip,application/zip" />
    <div class="toolbar">
      <button id="saveManifestBtn" type="button" disabled>manifest.json 저장</button>
      <button id="saveZipBtn" type="button" disabled>수정 ZIP 저장</button>
      <button id="jpegZipBtn" type="button" disabled>합성 JPEG ZIP</button>
      <button id="printBtn" class="primary" type="button" disabled>PDF 인쇄</button>
    </div>
    <p id="status" class="status">ZIP 파일을 선택하세요.</p>
  </section>

  <section id="exportSettingsPanel" class="panel export-settings" hidden>
    <strong>합성 JPEG 설정</strong> <span class="muted">(manifest 설정을 기본값으로 불러옵니다)</span>
    <div class="settings-grid">
      <label>
        표시 방식
        <select id="optTextLayout">
          <option value="caption">별도 영역</option>
          <option value="watermark">워터마크</option>
        </select>
      </label>
      <label>
        워터마크 스타일
        <select id="optWatermarkStyle">
          <option value="solid_dark">검은 반투명</option>
          <option value="solid_light">흰색 반투명</option>
        </select>
      </label>
      <label>
        제목 정렬
        <select id="optTitleAlign">
          <option value="left">왼쪽</option>
          <option value="center">가운데</option>
          <option value="right">오른쪽</option>
        </select>
      </label>
      <label>
        메모 정렬
        <select id="optMemoAlign">
          <option value="left">왼쪽</option>
          <option value="center">가운데</option>
          <option value="right">오른쪽</option>
        </select>
      </label>
      <label>
        좌표 표기
        <select id="optCoordsLabel">
          <option value="off">숫자만</option>
          <option value="gps">GPS</option>
          <option value="coords">좌표</option>
        </select>
      </label>
      <label>
        촬영 일시
        <select id="optShowDatetime">
          <option value="true">제목에 포함</option>
          <option value="false">제목에서 제외</option>
        </select>
      </label>
    </div>
  </section>

  <section id="editorPanel" class="panel" hidden>
    <label for="reportTitle">보고서 제목</label>
    <input id="reportTitle" class="report-title-input" type="text" placeholder="1페이지 상단 제목 (선택)" />
    <div style="overflow-x:auto; margin-top: 0.75rem;">
      <table>
        <thead>
          <tr>
            <th>순번</th>
            <th>미리보기</th>
            <th>제목</th>
            <th>메모</th>
            <th>층</th>
            <th>좌표</th>
            <th>촬영일시</th>
          </tr>
        </thead>
        <tbody id="stampRows"></tbody>
      </table>
    </div>
  </section>

  <section id="printPanel" class="panel print-report" hidden>
    <h2 id="printReportTitle"></h2>
    <div id="printItems"></div>
  </section>

  <div id="lightbox" class="lightbox" hidden>
    <img id="lightboxImg" alt="원본 미리보기" />
  </div>

  <script src="/report/jszip.min.js"></script>
  <script src="/report/watermark-export.js"></script>
  <script>
    const zipInput = document.getElementById('zipInput');
    const saveManifestBtn = document.getElementById('saveManifestBtn');
    const saveZipBtn = document.getElementById('saveZipBtn');
    const jpegZipBtn = document.getElementById('jpegZipBtn');
    const printBtn = document.getElementById('printBtn');
    const statusEl = document.getElementById('status');
    const editorPanel = document.getElementById('editorPanel');
    const exportSettingsPanel = document.getElementById('exportSettingsPanel');
    const stampRows = document.getElementById('stampRows');
    const reportTitleInput = document.getElementById('reportTitle');
    const printPanel = document.getElementById('printPanel');
    const printReportTitle = document.getElementById('printReportTitle');
    const printItems = document.getElementById('printItems');
    const lightbox = document.getElementById('lightbox');
    const lightboxImg = document.getElementById('lightboxImg');
    const optTextLayout = document.getElementById('optTextLayout');
    const optWatermarkStyle = document.getElementById('optWatermarkStyle');
    const optTitleAlign = document.getElementById('optTitleAlign');
    const optMemoAlign = document.getElementById('optMemoAlign');
    const optCoordsLabel = document.getElementById('optCoordsLabel');
    const optShowDatetime = document.getElementById('optShowDatetime');

    let loadedZip = null;
    let manifest = null;
    const imageUrls = new Map();
    let exportBusy = false;

    function setStatus(text) {
      statusEl.textContent = text;
    }

    function setExportBusy(busy) {
      exportBusy = busy;
      const disabled = busy || !manifest;
      jpegZipBtn.disabled = disabled;
      saveManifestBtn.disabled = disabled;
      saveZipBtn.disabled = disabled;
      printBtn.disabled = disabled;
    }

    function revokeImageUrls() {
      for (const url of imageUrls.values()) {
        URL.revokeObjectURL(url);
      }
      imageUrls.clear();
    }

    function formatCoords(stamp) {
      if (stamp.latitude == null || stamp.longitude == null) return '';
      return `${Number(stamp.latitude).toFixed(6)}, ${Number(stamp.longitude).toFixed(6)}`;
    }

    function formatDate(ts) {
      return new Date(ts).toLocaleString('ko-KR');
    }

    function floorLabel(floor) {
      if (!floor) return '';
      return `${floor}층`;
    }

    function applyExportSettingsToUi(settings) {
      const normalized = VoiceStampReportExport.normalizeExportSettings(settings);
      optTextLayout.value = normalized.textLayout;
      optWatermarkStyle.value = normalized.watermarkStyle;
      optTitleAlign.value = normalized.titleAlign;
      optMemoAlign.value = normalized.memoAlign;
      optCoordsLabel.value = normalized.coordsLabel;
      optShowDatetime.value = normalized.showDatetime ? 'true' : 'false';
    }

    function readExportOptionsFromUi() {
      return VoiceStampReportExport.normalizeExportSettings({
        textLayout: optTextLayout.value,
        watermarkStyle: optWatermarkStyle.value,
        titleAlign: optTitleAlign.value,
        memoAlign: optMemoAlign.value,
        coordsLabel: optCoordsLabel.value,
        showDatetime: optShowDatetime.value === 'true',
      });
    }

    function openLightbox(src) {
      lightboxImg.src = src;
      lightbox.hidden = false;
    }

    function closeLightbox() {
      lightbox.hidden = true;
      lightboxImg.removeAttribute('src');
    }

    function bindThumbClicks() {
      stampRows.querySelectorAll('.thumb').forEach((img) => {
        img.addEventListener('click', () => openLightbox(img.src));
      });
    }

    function readManifestFromEditor() {
      if (!manifest) return null;
      const rows = [...stampRows.querySelectorAll('tr[data-index]')];
      const next = structuredClone(manifest);
      next.reportTitle = reportTitleInput.value.trim();
      rows.forEach((row) => {
        const index = Number(row.dataset.index);
        const stamp = next.stamps[index];
        stamp.title = row.querySelector('[data-field="title"]').value;
        stamp.memo = row.querySelector('[data-field="memo"]').value;
        const floorRaw = row.querySelector('[data-field="floor"]').value.trim();
        stamp.floor = floorRaw ? floorRaw.replace(/층$/, '') : null;
      });
      next.exportedAt = Date.now();
      return next;
    }

    function renderEditor() {
      stampRows.innerHTML = '';
      manifest.stamps.forEach((stamp, index) => {
        const tr = document.createElement('tr');
        tr.dataset.index = String(index);
        const imgUrl = imageUrls.get(stamp.imageFile) || '';
        tr.innerHTML = `
          <td>${index + 1}</td>
          <td>${imgUrl ? `<img class="thumb" src="${imgUrl}" alt="">` : '(없음)'}</td>
          <td><input data-field="title" value="${escapeAttr(stamp.title)}" /></td>
          <td><textarea data-field="memo">${escapeHtml(stamp.memo || '')}</textarea></td>
          <td><input data-field="floor" value="${escapeAttr(floorLabel(stamp.floor))}" placeholder="예: 3층" /></td>
          <td>${escapeHtml(formatCoords(stamp))}</td>
          <td>${escapeHtml(formatDate(stamp.createdAt))}</td>
        `;
        stampRows.appendChild(tr);
      });
      bindThumbClicks();
      reportTitleInput.value = manifest.reportTitle || '';
      applyExportSettingsToUi(manifest.exportSettings || {});
      editorPanel.hidden = false;
      exportSettingsPanel.hidden = false;
      setExportBusy(false);
    }

    function escapeHtml(text) {
      return String(text)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    function escapeAttr(text) {
      return escapeHtml(text).replace(/'/g, '&#39;');
    }

    async function loadZip(file) {
      revokeImageUrls();
      loadedZip = null;
      manifest = null;
      editorPanel.hidden = true;
      exportSettingsPanel.hidden = true;
      setExportBusy(true);

      const zip = await JSZip.loadAsync(file);
      const manifestFile = zip.file('manifest.json');
      if (!manifestFile) {
        throw new Error('manifest.json이 없습니다. VoiceStamp 프로젝트 ZIP인지 확인하세요.');
      }
      manifest = JSON.parse(await manifestFile.async('string'));
      if (!manifest.stamps || !Array.isArray(manifest.stamps)) {
        throw new Error('manifest 형식이 올바르지 않습니다.');
      }

      for (const stamp of manifest.stamps) {
        const imageEntry = zip.file(`stamps/${stamp.imageFile}`);
        if (!imageEntry) continue;
        const blob = await imageEntry.async('blob');
        imageUrls.set(stamp.imageFile, URL.createObjectURL(blob));
      }

      loadedZip = zip;
      renderEditor();
      setStatus(`${file.name} — ${manifest.stamps.length}장 로드됨`);
    }

    function downloadBlob(blob, fileName) {
      const url = URL.createObjectURL(blob);
      const anchor = document.createElement('a');
      anchor.href = url;
      anchor.download = fileName;
      anchor.click();
      URL.revokeObjectURL(url);
    }

    saveManifestBtn.addEventListener('click', () => {
      const next = readManifestFromEditor();
      if (!next) return;
      const blob = new Blob([JSON.stringify(next, null, 2)], { type: 'application/json' });
      downloadBlob(blob, 'manifest.json');
      setStatus('manifest.json을 저장했습니다.');
    });

    saveZipBtn.addEventListener('click', async () => {
      const next = readManifestFromEditor();
      if (!next || !loadedZip) return;
      setExportBusy(true);
      try {
        const zip = new JSZip();
        zip.file('manifest.json', JSON.stringify(next, null, 2));
        const stampsFolder = zip.folder('stamps');
        for (const stamp of next.stamps) {
          const url = imageUrls.get(stamp.imageFile);
          if (!url) continue;
          const response = await fetch(url);
          const blob = await response.blob();
          stampsFolder.file(stamp.imageFile, blob);
        }
        const pdfFile = loadedZip.file('report.pdf');
        if (pdfFile) {
          zip.file('report.pdf', await pdfFile.async('uint8array'));
        }
        const blob = await zip.generateAsync({ type: 'blob' });
        const baseName = (next.reportTitle || 'VoiceStamp').replace(/[\\/:*?"<>|]/g, '_');
        downloadBlob(blob, `${baseName}.voicestamp.zip`);
        setStatus('수정된 ZIP을 저장했습니다.');
      } finally {
        setExportBusy(false);
      }
    });

    jpegZipBtn.addEventListener('click', async () => {
      const next = readManifestFromEditor();
      if (!next) return;
      setExportBusy(true);
      try {
        const options = readExportOptionsFromUi();
        const result = await VoiceStampReportExport.createStampsJpegZip(
          next,
          imageUrls,
          options,
          (current, total) => {
            setStatus(`합성 JPEG 생성 중… ${current} / ${total}`);
          },
        );
        downloadBlob(result.blob, result.fileName);
        setStatus(`합성 JPEG ZIP을 저장했습니다. (${result.fileName})`);
      } catch (error) {
        setStatus(error instanceof Error ? error.message : 'JPEG ZIP 저장에 실패했습니다.');
      } finally {
        setExportBusy(false);
      }
    });

    printBtn.addEventListener('click', () => {
      const next = readManifestFromEditor();
      if (!next) return;
      printItems.innerHTML = '';
      const title = next.reportTitle?.trim();
      printReportTitle.textContent = title || '';
      printReportTitle.style.display = title ? 'block' : 'none';

      next.stamps.forEach((stamp) => {
        const item = document.createElement('div');
        item.className = 'print-item';
        const imgUrl = imageUrls.get(stamp.imageFile);
        const coords = formatCoords(stamp);
        item.innerHTML = `
          ${imgUrl ? `<img src="${imgUrl}" alt="">` : ''}
          <div class="print-meta"><strong>${escapeHtml(stamp.title || '(제목 없음)')}</strong></div>
          ${stamp.memo ? `<div class="print-meta">${escapeHtml(stamp.memo)}</div>` : ''}
          ${stamp.floor ? `<div class="print-meta">${escapeHtml(floorLabel(stamp.floor))}</div>` : ''}
          ${coords ? `<div class="print-meta">${escapeHtml(coords)}</div>` : ''}
          <div class="print-meta muted">${escapeHtml(formatDate(stamp.createdAt))}</div>
        `;
        printItems.appendChild(item);
      });

      printPanel.hidden = false;
      window.print();
      printPanel.hidden = true;
      setStatus('인쇄 대화상자를 열었습니다. PDF로 저장을 선택하세요.');
    });

    zipInput.addEventListener('change', async (event) => {
      const file = event.target.files?.[0];
      if (!file) return;
      try {
        await loadZip(file);
      } catch (error) {
        setExportBusy(false);
        setStatus(error instanceof Error ? error.message : 'ZIP을 열지 못했습니다.');
      }
    });

    lightbox.addEventListener('click', closeLightbox);
    document.addEventListener('keydown', (event) => {
      if (event.key === 'Escape') {
        closeLightbox();
      }
    });
  </script>
</body>
</html>
