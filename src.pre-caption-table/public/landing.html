  <script>
    (function () {
      var SITE_URL = 'https://voicestamp-gilt.vercel.app/';

      if (typeof QRCode !== 'undefined') {
        new QRCode(document.getElementById('site-qr'), {
          text: SITE_URL,
          width: 120,
          height: 120,
          colorDark: '#111827',
          colorLight: '#ffffff',
          correctLevel: QRCode.CorrectLevel.M,
        });
      }

      var shareBtn = document.getElementById('share-site');
      if (shareBtn) {
        shareBtn.addEventListener('click', function () {
          var payload = {
            title: 'VoiceStamp',
            text: 'VoiceStamp Android ???덊럹?댁?',
            url: SITE_URL,
          };

          if (navigator.share) {
            navigator.share(payload).catch(function (err) {
              if (err && err.name === 'AbortError') return;
              fallbackCopy(SITE_URL);
            });
            return;
          }
          fallbackCopy(SITE_URL);
        });
      }

      function fallbackCopy(url) {
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(url).then(function () {
            alert('留곹겕瑜?蹂듭궗?덉뒿?덈떎.');
          }).catch(function () {
            window.prompt('?꾨옒 留곹겕瑜?蹂듭궗?섏꽭??', url);
          });
          return;

        window.prompt('?꾨옒 留곹겕瑜?蹂듭궗?섏꽭??', url);
      }
    })();

  <script>
    (function () {
      var el = document.getElementById('visitor-stats');
      if (!el) return;

      var today = new Date().toISOString().slice(0, 10);
      var seenKey = 'vs_landing_seen_' + today;

      function showStats(data) {
        if (!data || typeof data.daily !== 'number' || typeof data.total !== 'number') return;
        el.textContent = '?ㅻ뒛 諛⑸Ц ' + data.daily.toLocaleString('ko-KR')
          + ' 쨌 ?꾩쟻 ' + data.total.toLocaleString('ko-KR');
      }

      function loadStats() {
        fetch('/api/visitor')
          .then(function (res) { return res.ok ? res.json() : null; })
          .then(showStats)
          .catch(function () {});
      }

      if (localStorage.getItem(seenKey)) {
        loadStats();
        return;
      }

      localStorage.setItem(seenKey, '1');
      fetch('/api/visitor', { method: 'POST', keepalive: true })
        .then(function (res) { return res.ok ? res.json() : null; })
        .then(function (data) {
          if (data) showStats(data);
          else loadStats();
        })
        .catch(loadStats);
    })();
  </script>
