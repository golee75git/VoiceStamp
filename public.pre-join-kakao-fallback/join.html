<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>VoiceStamp 사업 참여</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 0; padding: 24px; background: #f9fafb; color: #111; }
    .card { max-width: 420px; margin: 40px auto; background: #fff; border-radius: 12px; padding: 24px; border: 1px solid #e5e7eb; }
    h1 { font-size: 1.25rem; margin: 0 0 12px; }
    p { line-height: 1.5; color: #374151; }
    code { background: #f3f4f6; padding: 2px 6px; border-radius: 4px; word-break: break-all; }
    a.btn { display: inline-block; margin-top: 12px; margin-right: 8px; background: #111; color: #fff; text-decoration: none; padding: 12px 16px; border-radius: 10px; font-weight: 700; }
    a.btn.secondary { background: #fff; color: #111; border: 1px solid #d1d5db; }
    .hint { font-size: 0.875rem; color: #6b7280; margin-top: 16px; }
    .note { font-size: 0.875rem; color: #1e40af; background: #eff6ff; border: 1px solid #bfdbfe; border-radius: 10px; padding: 10px 12px; margin-top: 12px; line-height: 1.45; }
  </style>
</head>
<body>
  <div class="card">
    <h1>VoiceStamp 사업 참여</h1>
    <p>아래 버튼으로 앱을 엽니다. 앱에서는 참여 코드가 채워지고, <strong>구분 표시</strong>만 입력한 뒤 「연결 후 촬영」하면 촬영 화면으로 갑니다.</p>
    <p id="codes">링크를 확인하는 중…</p>
    <a class="btn" id="openApp" href="#">앱에서 참여·촬영</a>
    <a class="btn secondary" href="https://voicestamp-gilt.vercel.app/">APK·앱 안내</a>
    <p class="note" id="kakaoNote" style="display:none">카톡·일부 앱 안 브라우저에서는 앱이 바로 열리지 않을 수 있습니다. <strong>「앱에서 참여·촬영」</strong>을 누르거나, 메뉴에서 <strong>다른 브라우저로 열기</strong>를 사용해 주세요. 이 참여 페이지는 그대로 유지됩니다.</p>
    <p class="hint">앱이 열리지 않으면 APK를 설치한 뒤 다시 누르거나, 앱 설정 → 사업 취합 → 코드로 참여에 위 코드를 붙여 넣으세요.</p>
  </div>
  <script>
    (function () {
      var q = new URLSearchParams(location.search);
      var p = q.get('p') || '';
      var c = q.get('c') || '';
      var el = document.getElementById('codes');
      var openBtn = document.getElementById('openApp');
      var kakaoNote = document.getElementById('kakaoNote');
      if (p && c) {
        el.innerHTML = '사업코드 <code>' + p + '</code><br/>참여코드 <code>' + c + '</code>';
        var joinPage =
          'https://voicestamp-gilt.vercel.app/join?p=' +
          encodeURIComponent(p) +
          '&c=' +
          encodeURIComponent(c);
        var appUrl = 'voicestamp://join?p=' + encodeURIComponent(p) + '&c=' + encodeURIComponent(c);
        // Fallback must stay on this join page (not the landing/main page).
        var intentUrl =
          'intent://join?p=' +
          encodeURIComponent(p) +
          '&c=' +
          encodeURIComponent(c) +
          '#Intent;scheme=voicestamp;package=com.voicestamp.app;S.browser_fallback_url=' +
          encodeURIComponent(joinPage) +
          ';end';
        openBtn.href = intentUrl;
        openBtn.addEventListener('click', function () {
          setTimeout(function () {
            try {
              window.location.href = appUrl;
            } catch (e) {}
          }, 400);
        });
        var ua = navigator.userAgent || '';
        if (/KAKAOTALK/i.test(ua) || /FBAN|FBAV|Instagram/i.test(ua)) {
          kakaoNote.style.display = 'block';
        }
        // Do NOT auto-redirect on load: in-app browsers (Kakao etc.) often fail intent
        // and then jump to browser_fallback_url.
      } else {
        el.textContent = '유효한 참여 링크가 아닙니다.';
        openBtn.style.display = 'none';
      }
    })();
  </script>
</body>
</html>
